name: Playwright browsers
description: Restore ~/Library/Caches/ms-playwright and install browsers without --with-deps.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-
    - shell: sh
      run: defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
    - shell: sh
      run: sh "$GITHUB_WORKSPACE/.github/scripts/firefox-tmp.sh" allocate
    - shell: bash
      run: npx playwright install ${{ inputs.browsers }}
