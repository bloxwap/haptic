name: Playwright browsers
description: Install Chromium/WebKit without --with-deps; reuse the mini on-disk cache.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: true
runs:
  using: composite
  steps:
    - shell: sh
      run: sh "$GITHUB_WORKSPACE/.github/scripts/macos-path.sh"
    - shell: sh
      run: defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
    - shell: bash
      run: npx playwright install ${{ inputs.browsers }}
    - shell: sh
      run: xattr -cr "$HOME/Library/Caches/ms-playwright" || true
