name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node --test .github/scripts/wait-for-registry.test.mjs .github/scripts/check-publish-auth.test.mjs .github/scripts/release-check.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run test:matrix
      - run: npm run size
      - run: npm run pack:check
      - run: npm audit --audit-level=high
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: sh .github/scripts/start-test-audio.sh
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failures
          path: packages/haptic/test-results/
