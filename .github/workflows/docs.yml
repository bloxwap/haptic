name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /haptic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium firefox webkit
      - run: npm run docs:smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docs-failures
          path: apps/docs/test-results/
      - if: always() && env.HAPTIC_FIREFOX_TMPDIR != ''
        run: sh .github/scripts/firefox-tmp.sh cleanup
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
  smoke:
    needs: deploy
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOCS_URL: https://bloxwap.github.io/haptic/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium firefox webkit
      - run: npm run docs:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-docs-failures
          path: apps/docs/test-results/
      - if: always() && env.HAPTIC_FIREFOX_TMPDIR != ''
        run: sh .github/scripts/firefox-tmp.sh cleanup
