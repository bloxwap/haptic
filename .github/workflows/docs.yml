name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    # Release scan, parallel with changes/build. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Only filter PRs; main pushes and manual runs keep all existing checks.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Skip PRs outside the docs build, library and install/browser inputs.
            code:
              - 'apps/docs/**'
              - 'packages/haptic/**'
              - 'vendor/**'
              - 'package.json'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/npm-shrinkwrap.json'
              - '**/.npmrc'
              - '.github/actions/playwright-browsers/**'
              - '.github/workflows/docs.yml'
  build:
    needs: changes
    # Skip irrelevant PRs while preserving the required check name.
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /haptic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run docs:smoke
      - run: command -v gtar
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-failures
          path: apps/docs/test-results/
  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
  smoke:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOCS_URL: https://bloxwap.github.io/haptic/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run docs:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-docs-failures
          path: apps/docs/test-results/
