name: Registry smoke
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published package version to verify
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    env:
      HAPTIC_REGISTRY_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: npm run registry:check
