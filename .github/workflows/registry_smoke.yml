name: Registry smoke
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published package version to verify
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    env:
      HAPTIC_REGISTRY_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: npm run registry:check
      - if: always() && env.HAPTIC_FIREFOX_TMPDIR != ''
        run: sh .github/scripts/firefox-tmp.sh cleanup
