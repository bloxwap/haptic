name: Registry smoke
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published package version to verify
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAPTIC_REGISTRY_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run registry:check
