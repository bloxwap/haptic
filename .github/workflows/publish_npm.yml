name: Publish npm
# Only publish uses GitHub-hosted runners: npm trusted publishing requires them.
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  security:
    # Release scan, parallel with validate.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  validate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NEXT_PUBLIC_BASE_PATH: /haptic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run release:check
        id: release
      - run: npm ci
      - run: node --test .github/scripts/wait-for-registry.test.mjs .github/scripts/check-publish-auth.test.mjs .github/scripts/release-check.test.mjs
      - run: npm run typecheck
      - run: npm run test:matrix
      - run: npm run size
      - run: npm run pack:check
      - run: npm audit --audit-level=high
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: sh .github/scripts/start-test-audio.sh
      - run: npm run test:browser
      - run: npm run docs:smoke
      - run: npm run pack:haptic
      - run: sh .github/scripts/sha256.sh digest SHA256SUMS bloxwap-haptic-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            bloxwap-haptic-*.tgz
            SHA256SUMS
          if-no-files-found: error
  publish:
    needs: [validate, security]
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      HAPTIC_REGISTRY_VERSION: ${{ needs.validate.outputs.version }}
      DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
      HAPTIC_EXPECTED_TARBALL: .release-artifacts/bloxwap-haptic-${{ needs.validate.outputs.version }}.tgz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: node .github/scripts/check-publish-auth.mjs
        env:
          # Transitional fallback; delete once the npm Trusted Publisher works.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .release-artifacts
      - run: sh "$GITHUB_WORKSPACE/.github/scripts/sha256.sh" verify SHA256SUMS
        working-directory: .release-artifacts
      - run: npm run release:check
      # Install registry:check browsers before publishing so an apt/browser download
      # failure stops the release instead of failing after the upload.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - run: npm publish "$HAPTIC_EXPECTED_TARBALL" --access public --tag "$DIST_TAG" --provenance
        env:
          # Transitional fallback; delete once the npm Trusted Publisher works.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run registry:check
