name: Publish npm
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# org-level NPM_TOKEN secret instead. That drops OIDC trusted publishing and
# automatic provenance.
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  security:
    # Release scan, parallel with validate.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@0387d86d796b5a80509a9862b35991a160ff13b4 # v1.0.1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  validate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NEXT_PUBLIC_BASE_PATH: /haptic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run release:check
        id: release
      - run: npm ci
      - run: node --test .github/scripts/wait-for-registry.test.mjs .github/scripts/check-publish-auth.test.mjs .github/scripts/release-check.test.mjs
      - run: npm run typecheck
      - run: npm run test:matrix
      - run: npm run size
      - run: npm run pack:check
      - run: npm audit --audit-level=high
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: sh .github/scripts/start-test-audio.sh
      - run: npm run test:browser
      - run: npm run docs:smoke
      - run: npm run pack:haptic
      - run: sh .github/scripts/sha256.sh digest SHA256SUMS bloxwap-haptic-*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            bloxwap-haptic-*.tgz
            SHA256SUMS
          if-no-files-found: error
  publish:
    needs: [validate, security]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      HAPTIC_REGISTRY_VERSION: ${{ needs.validate.outputs.version }}
      DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
      HAPTIC_EXPECTED_TARBALL: .release-artifacts/bloxwap-haptic-${{ needs.validate.outputs.version }}.tgz
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: node .github/scripts/check-publish-auth.mjs
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: .release-artifacts
      - run: sh "$GITHUB_WORKSPACE/.github/scripts/sha256.sh" verify SHA256SUMS
        working-directory: .release-artifacts
      - run: npm run release:check
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - run: npm publish "$HAPTIC_EXPECTED_TARBALL" --access public --tag "$DIST_TAG"
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: npm run registry:check
